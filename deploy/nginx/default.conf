# Reverse proxy: the only published entry point. The application container is reachable only on
# the internal Compose network as app:8080.
upstream lastmile_app {
    server app:8080;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://lastmile_app;
        proxy_http_version 1.1;
        # $http_host is what the browser used (e.g. localhost:8088). $server_port would be the
        # container's port 80 and break absolute redirects such as the post-login Location header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Lightweight check of Nginx itself (does not touch the application).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
