<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container app-main" th:with="s=${summary}">
    <h1 class="page-title">Dashboard</h1>
    <p class="text-secondary" data-testid="dashboard-scope"
       th:text="${s.scope() == 'MY_ASSIGNMENTS'} ? 'Summary of deliveries assigned to you.' : 'Summary of all deliveries.'">Summary</p>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-4 col-xl-2">
            <a class="app-card metric-card d-block text-decoration-none" th:href="@{/deliveries}" data-testid="metric-total">
                <div class="metric-label">Total</div>
                <div class="metric-value" data-testid="metric-value" th:text="${s.total()}">0</div>
            </a>
        </div>
        <div class="col-6 col-md-4 col-xl-2" th:each="st : ${statuses}">
            <a class="app-card metric-card d-block text-decoration-none" th:href="@{/deliveries(status=${st})}"
               th:attr="data-testid='metric-' + ${#strings.toLowerCase(st)}">
                <div class="metric-label" th:text="${st.label()}">Status</div>
                <div class="metric-value" data-testid="metric-value" th:text="${s.count(st)}">0</div>
            </a>
        </div>
    </div>

    <section class="app-card" aria-labelledby="recent-heading">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 id="recent-heading" class="h5 mb-0">Recent deliveries</h2>
            <a th:href="@{/deliveries}" class="small">View all</a>
        </div>
        <p th:if="${s.recent().isEmpty()}" class="text-secondary mb-0" data-testid="recent-empty">
            No deliveries yet.
            <a sec:authorize="hasAnyRole('ADMIN','DISPATCHER')" th:href="@{/deliveries/new}">Create the first one.</a>
        </p>
        <ul th:unless="${s.recent().isEmpty()}" class="list-unstyled mb-0" data-testid="recent-list">
            <li th:each="d : ${s.recent()}" class="d-flex flex-wrap gap-2 align-items-center py-2 border-top">
                <a th:href="@{/deliveries/{id}(id=${d.id()})}" th:text="${d.deliveryCode()}">LMD</a>
                <span th:text="${d.recipientName()} + ', ' + ${d.deliveryCity()}">Name, City</span>
                <span th:replace="~{fragments/layout :: status(${d.status()})}"></span>
            </li>
        </ul>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
