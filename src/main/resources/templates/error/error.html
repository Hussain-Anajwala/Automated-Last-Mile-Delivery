<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container app-main">
    <div class="app-card" data-testid="error-page" data-error="error">
        <h1 class="page-title">Something went wrong</h1>
        <p>An unexpected error occurred. Please try again later.</p>
        <a class="btn btn-outline-secondary" th:href="@{/}">Back to home</a>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
