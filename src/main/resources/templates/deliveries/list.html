<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Deliveries')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container app-main">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <h1 class="page-title mb-0">Deliveries</h1>
            <p class="text-secondary mb-0" sec:authorize="hasRole('AGENT')">Deliveries assigned to you.</p>
        </div>
        <a sec:authorize="hasAnyRole('ADMIN','DISPATCHER')" th:href="@{/deliveries/new}" class="btn btn-primary"
           data-testid="list-create-delivery">Create delivery</a>
    </div>

    <form th:action="@{/deliveries}" method="get" class="app-card mb-3" role="search" data-testid="search-form">
        <div class="row g-2 align-items-end">
            <div class="col-md-5">
                <label for="q" class="form-label">Search</label>
                <input id="q" name="q" type="search" class="form-control" th:value="${search.q()}" maxlength="100"
                       placeholder="Code, recipient or reference" data-testid="search-q">
            </div>
            <div class="col-6 col-md-2">
                <label for="status" class="form-label">Status</label>
                <select id="status" name="status" class="form-select" data-testid="filter-status">
                    <option value="">All</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label()}"
                            th:selected="${s == search.status()}">Status</option>
                </select>
            </div>
            <div class="col-6 col-md-2" th:if="${agents != null}">
                <label for="agentId" class="form-label">Agent</label>
                <select id="agentId" name="agentId" class="form-select" data-testid="filter-agent">
                    <option value="">All</option>
                    <option th:each="a : ${agents}" th:value="${a.id()}" th:text="${a.name()}"
                            th:selected="${a.id() == search.agentId()}">Agent</option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary" data-testid="search-submit">Search</button>
                <a th:href="@{/deliveries}" class="btn btn-outline-secondary" data-testid="search-reset">Reset</a>
            </div>
        </div>
    </form>

    <p class="text-secondary" data-testid="result-count" aria-live="polite"
       th:text="${results.totalElements} + (${results.totalElements} == 1 ? ' delivery' : ' deliveries')">0 deliveries</p>

    <div th:if="${results.empty}" class="app-card text-center" data-testid="empty-state">
        <p class="mb-2" th:text="${search.hasFilters()} ? 'No deliveries match these filters.' : 'There are no deliveries yet.'">No deliveries.</p>
        <a th:if="${search.hasFilters()}" th:href="@{/deliveries}" class="btn btn-outline-secondary btn-sm">Reset filters</a>
    </div>

    <div th:unless="${results.empty}" class="app-card p-0 table-responsive">
        <table class="table table-hover align-middle mb-0" data-testid="delivery-table">
            <caption class="visually-hidden">Deliveries</caption>
            <thead>
            <tr>
                <th scope="col">Code</th>
                <th scope="col">Recipient</th>
                <th scope="col">City</th>
                <th scope="col">Reference</th>
                <th scope="col">Agent</th>
                <th scope="col">Status</th>
                <th scope="col">Created</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${results.content}" data-testid="delivery-row" th:attr="data-code=${d.deliveryCode()}">
                <td><a th:href="@{/deliveries/{id}(id=${d.id()})}" th:text="${d.deliveryCode()}"
                       data-testid="delivery-link">LMD</a></td>
                <td th:text="${d.recipientName()}">Name</td>
                <td th:text="${d.deliveryCity()}">City</td>
                <td th:text="${d.referenceNumber() ?: '—'}">Ref</td>
                <td th:text="${d.assignedAgentName() ?: 'Unassigned'}">Agent</td>
                <td><span th:replace="~{fragments/layout :: status(${d.status()})}"></span></td>
                <td><time th:datetime="${d.createdAt()}" th:text="${#temporals.format(d.createdAt(), 'dd MMM yyyy')}">date</time></td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${results.totalPages > 1}" aria-label="Pagination" class="mt-3" data-testid="pagination">
        <ul class="pagination">
            <li class="page-item" th:classappend="${results.first} ? 'disabled'">
                <a class="page-link" th:href="@{/deliveries(q=${search.q()},status=${search.status()},agentId=${search.agentId()},page=${results.number - 1},size=${results.size})}"
                   data-testid="page-prev">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link"
                    th:text="'Page ' + ${results.number + 1} + ' of ' + ${results.totalPages}">Page 1</span></li>
            <li class="page-item" th:classappend="${results.last} ? 'disabled'">
                <a class="page-link" th:href="@{/deliveries(q=${search.q()},status=${search.status()},agentId=${search.agentId()},page=${results.number + 1},size=${results.size})}"
                   data-testid="page-next">Next</a>
            </li>
        </ul>
    </nav>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
