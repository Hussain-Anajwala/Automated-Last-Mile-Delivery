<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edit delivery' : 'Create delivery')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container app-main">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small mb-0">
            <li class="breadcrumb-item"><a th:href="@{/deliveries}" class="text-decoration-none">Deliveries</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${editing} ? 'Edit ' + ${editing.deliveryCode()} : 'New Delivery'">New</li>
        </ol>
    </nav>

    <div class="mb-4">
        <h1 class="page-title mb-1" th:text="${editing} ? 'Edit ' + ${editing.deliveryCode()} : 'Create delivery'">Create delivery</h1>
        <p class="text-secondary mb-0" th:text="${editing} ? 'Only recipient, address and reference details can be edited. Status and assignment are changed from the delivery page.' : 'Delivery code, status and timestamps are set by the system.'">
            Delivery code, status and timestamps are set by the system.</p>
    </div>

    <form th:action="${editing} ? @{/deliveries/{id}/edit(id=${editing.id()})} : @{/deliveries/new}"
          th:object="${deliveryForm}" method="post" novalidate data-once class="app-form" data-testid="delivery-form">
        <input type="hidden" name="version" th:if="${editing}" th:value="${editing.version()}">

        <!-- Error Summary Banner -->
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger shadow-sm mb-4" role="alert"
             data-testid="form-error-summary" tabindex="-1">
            <div class="fw-semibold mb-1">Please correct the highlighted fields:</div>
            <ul class="mb-0 ps-3">
                <li th:each="err : ${#fields.detailedErrors()}" th:text="${err.message}">Error</li>
            </ul>
        </div>

        <!-- Recipient Information -->
        <fieldset class="app-section shadow-sm">
            <legend class="fw-semibold border-bottom pb-2 mb-3">Recipient</legend>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="recipientName" class="form-label fw-medium">Recipient name <span class="text-danger">*</span></label>
                    <input th:field="*{recipientName}" class="form-control" th:errorclass="is-invalid" maxlength="120"
                           placeholder="Full name" aria-describedby="recipientName-error" data-testid="recipientName">
                    <div id="recipientName-error" class="invalid-feedback" th:errors="*{recipientName}"></div>
                </div>
                <div class="col-md-6">
                    <label for="phoneCountry" class="form-label fw-medium">Phone country <span class="text-danger">*</span></label>
                    <select th:field="*{phoneCountry}" class="form-select" th:errorclass="is-invalid"
                            aria-describedby="phoneCountry-error" data-testid="phoneCountry" data-phone-country>
                        <option th:each="c : ${phoneCountries}" th:value="${c.region()}" th:text="${c.label()}"
                                th:attr="data-calling-code=${c.callingCode()}">India (+91)</option>
                    </select>
                    <div id="phoneCountry-error" class="invalid-feedback" th:errors="*{phoneCountry}"></div>
                </div>
                <div class="col-md-6">
                    <label for="recipientPhone" class="form-label fw-medium">Phone number <span class="text-danger">*</span></label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-light text-secondary fw-semibold font-monospace" data-testid="phoneCallingCode" data-phone-calling-code
                              th:text="${phoneCallingCode}">+91</span>
                        <input th:field="*{recipientPhone}" type="tel" inputmode="numeric" autocomplete="tel-national"
                               class="form-control" th:errorclass="is-invalid" maxlength="17"
                               placeholder="National number digits"
                               aria-describedby="recipientPhone-help recipientPhone-error"
                               data-testid="recipientPhone">
                        <div id="recipientPhone-error" class="invalid-feedback" th:errors="*{recipientPhone}"
                             data-testid="recipientPhone-error"></div>
                    </div>
                    <div id="recipientPhone-help" class="form-text text-muted small">Digits only, without the country code. India: exactly 10 digits.</div>
                </div>
            </div>
        </fieldset>

        <!-- Delivery Address -->
        <fieldset class="app-section shadow-sm">
            <legend class="fw-semibold border-bottom pb-2 mb-3">Delivery address</legend>
            <div class="row g-3">
                <div class="col-md-8">
                    <label for="deliveryAddress" class="form-label fw-medium">Street address <span class="text-danger">*</span></label>
                    <input th:field="*{deliveryAddress}" class="form-control" th:errorclass="is-invalid" maxlength="500"
                           placeholder="House/flat number, building, street, area"
                           aria-describedby="deliveryAddress-error" data-testid="deliveryAddress">
                    <div id="deliveryAddress-error" class="invalid-feedback" th:errors="*{deliveryAddress}"></div>
                </div>
                <div class="col-md-4">
                    <label for="deliveryCity" class="form-label fw-medium">City <span class="text-danger">*</span></label>
                    <input th:field="*{deliveryCity}" class="form-control" th:errorclass="is-invalid" maxlength="100"
                           placeholder="City / municipality"
                           aria-describedby="deliveryCity-error" data-testid="deliveryCity">
                    <div id="deliveryCity-error" class="invalid-feedback" th:errors="*{deliveryCity}"></div>
                </div>
            </div>
        </fieldset>

        <!-- Reference & Assignment -->
        <fieldset class="app-section shadow-sm">
            <legend class="fw-semibold border-bottom pb-2 mb-3" th:text="${editing} ? 'Reference' : 'Reference and assignment'">Reference and assignment</legend>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="referenceNumber" class="form-label fw-medium">Order / reference number</label>
                    <input th:field="*{referenceNumber}" class="form-control font-monospace" th:errorclass="is-invalid" maxlength="100"
                           placeholder="e.g. ORD-1001"
                           aria-describedby="referenceNumber-error" data-testid="referenceNumber">
                    <div id="referenceNumber-error" class="invalid-feedback" th:errors="*{referenceNumber}"></div>
                </div>
                <div class="col-md-6" th:unless="${editing}">
                    <label for="assignedAgentId" class="form-label fw-medium">Assign to agent (optional)</label>
                    <select th:field="*{assignedAgentId}" class="form-select" th:errorclass="is-invalid"
                            aria-describedby="assignedAgentId-error" data-testid="assignedAgentId">
                        <option value="">Not assigned yet</option>
                        <option th:each="agent : ${agents}" th:value="${agent.id}" th:text="${agent.name}">Agent</option>
                    </select>
                    <div id="assignedAgentId-error" class="invalid-feedback" th:errors="*{assignedAgentId}"></div>
                </div>
            </div>
        </fieldset>

        <div class="d-flex align-items-center gap-2 mt-4 pt-2">
            <button type="submit" class="btn btn-primary px-4 shadow-sm" data-testid="save-delivery">Save delivery</button>
            <a th:href="${editing} ? @{/deliveries/{id}(id=${editing.id()})} : @{/deliveries}" class="btn btn-outline-secondary"
               th:text="${editing} ? 'Cancel' : 'Back to deliveries'">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
