<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edit delivery' : 'Create delivery')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container app-main">
    <h1 class="page-title" th:text="${editing} ? 'Edit ' + ${editing.deliveryCode()} : 'Create delivery'">Create delivery</h1>
    <p class="text-secondary" th:text="${editing} ? 'Only recipient, address and reference details can be edited. Status and assignment are changed from the delivery page.' : 'Delivery code, status and timestamps are set by the system.'">
        Delivery code, status and timestamps are set by the system.</p>

    <form th:action="${editing} ? @{/deliveries/{id}/edit(id=${editing.id()})} : @{/deliveries/new}"
          th:object="${deliveryForm}" method="post" novalidate data-once class="app-form" data-testid="delivery-form">
        <input type="hidden" name="version" th:if="${editing}" th:value="${editing.version()}">
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"
             data-testid="form-error-summary" tabindex="-1">
            Please correct the highlighted fields.
            <ul class="mb-0" th:if="${#fields.hasGlobalErrors()}">
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</li>
            </ul>
        </div>

        <fieldset class="app-section">
            <legend>Recipient</legend>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="recipientName" class="form-label">Recipient name *</label>
                    <input th:field="*{recipientName}" class="form-control" th:errorclass="is-invalid" maxlength="120"
                           aria-describedby="recipientName-error" data-testid="recipientName">
                    <div id="recipientName-error" class="invalid-feedback" th:errors="*{recipientName}"></div>
                </div>
                <div class="col-md-6">
                    <label for="recipientPhone" class="form-label">Phone *</label>
                    <input th:field="*{recipientPhone}" type="tel" class="form-control" th:errorclass="is-invalid"
                           maxlength="20" aria-describedby="recipientPhone-help recipientPhone-error"
                           data-testid="recipientPhone">
                    <div id="recipientPhone-help" class="form-text">7–15 digits, optional leading +.</div>
                    <div id="recipientPhone-error" class="invalid-feedback" th:errors="*{recipientPhone}"></div>
                </div>
            </div>
        </fieldset>

        <fieldset class="app-section">
            <legend>Delivery address</legend>
            <div class="row g-3">
                <div class="col-md-8">
                    <label for="deliveryAddress" class="form-label">Address *</label>
                    <input th:field="*{deliveryAddress}" class="form-control" th:errorclass="is-invalid" maxlength="500"
                           aria-describedby="deliveryAddress-error" data-testid="deliveryAddress">
                    <div id="deliveryAddress-error" class="invalid-feedback" th:errors="*{deliveryAddress}"></div>
                </div>
                <div class="col-md-4">
                    <label for="deliveryCity" class="form-label">City *</label>
                    <input th:field="*{deliveryCity}" class="form-control" th:errorclass="is-invalid" maxlength="100"
                           aria-describedby="deliveryCity-error" data-testid="deliveryCity">
                    <div id="deliveryCity-error" class="invalid-feedback" th:errors="*{deliveryCity}"></div>
                </div>
            </div>
        </fieldset>

        <fieldset class="app-section">
            <legend th:text="${editing} ? 'Reference' : 'Reference and assignment'">Reference and assignment</legend>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="referenceNumber" class="form-label">Order / reference number</label>
                    <input th:field="*{referenceNumber}" class="form-control" th:errorclass="is-invalid" maxlength="100"
                           aria-describedby="referenceNumber-error" data-testid="referenceNumber">
                    <div id="referenceNumber-error" class="invalid-feedback" th:errors="*{referenceNumber}"></div>
                </div>
                <div class="col-md-6" th:unless="${editing}">
                    <label for="assignedAgentId" class="form-label">Assign to agent (optional)</label>
                    <select th:field="*{assignedAgentId}" class="form-select" th:errorclass="is-invalid"
                            aria-describedby="assignedAgentId-error" data-testid="assignedAgentId">
                        <option value="">Not assigned yet</option>
                        <option th:each="agent : ${agents}" th:value="${agent.id}" th:text="${agent.name}">Agent</option>
                    </select>
                    <div id="assignedAgentId-error" class="invalid-feedback" th:errors="*{assignedAgentId}"></div>
                </div>
            </div>
        </fieldset>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" data-testid="save-delivery">Save delivery</button>
            <a th:href="${editing} ? @{/deliveries/{id}(id=${editing.id()})} : @{/deliveries}" class="btn btn-outline-secondary"
               data-testid="cancel">Cancel</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
