<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${delivery.deliveryCode()})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container app-main" th:with="d=${delivery}">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
        <h1 class="page-title mb-0" data-testid="delivery-code" th:text="${d.deliveryCode()}">LMD-00000000-000000</h1>
        <span th:replace="~{fragments/layout :: status(${d.status()})}"></span>
    </div>

    <section th:if="${actions.canEdit() or actions.canAssign() or !actions.statusTargets().isEmpty()}"
             class="app-card mb-4" aria-labelledby="actions-heading" data-testid="actions-panel">
        <h2 id="actions-heading" class="h5">Actions</h2>
        <div class="row g-3">
            <div class="col-md-6" th:unless="${actions.statusTargets().isEmpty()}">
                <h3 class="h6">Update status</h3>
                <form th:each="target : ${actions.statusTargets()}" th:action="@{/deliveries/{id}/status(id=${d.id()})}"
                      method="post" class="mb-2" data-once th:attr="data-testid='status-form-' + ${#strings.toLowerCase(target)}">
                    <input type="hidden" name="newStatus" th:value="${target}">
                    <input type="hidden" name="version" th:value="${d.version()}">
                    <th:block th:if="${target.name() == 'FAILED'}">
                        <label for="failure-reason" class="form-label">Failure reason *</label>
                        <textarea id="failure-reason" name="reason" class="form-control mb-2" rows="2" maxlength="500"
                                  data-testid="failure-reason"></textarea>
                    </th:block>
                    <button type="submit" class="btn"
                            th:classappend="${target.name() == 'FAILED'} ? 'btn-outline-danger' : 'btn-primary'"
                            th:attr="data-testid='status-' + ${#strings.toLowerCase(target)}"
                            th:text="${target.name() == 'FAILED'} ? 'Mark as failed' : 'Mark as ' + ${#strings.toLowerCase(target.label())}">
                        Mark</button>
                </form>
            </div>
            <div class="col-md-6" th:if="${actions.canAssign()}">
                <h3 class="h6" th:text="${d.assignedAgentName() != null and d.status().name() == 'ASSIGNED'} ? 'Reassign agent' : 'Assign agent'">Assign agent</h3>
                <form th:action="@{/deliveries/{id}/assignment(id=${d.id()})}" method="post" data-once data-testid="assignment-form">
                    <input type="hidden" name="version" th:value="${d.version()}">
                    <label for="agentId" class="form-label">Agent</label>
                    <div class="d-flex gap-2">
                        <select id="agentId" name="agentId" class="form-select" required data-testid="assign-agent">
                            <option value="">Choose an agent</option>
                            <option th:each="a : ${agents}" th:value="${a.id()}" th:text="${a.name()}"
                                    th:selected="${a.id() == d.assignedAgentId()}">Agent</option>
                        </select>
                        <button type="submit" class="btn btn-primary" data-testid="assign-submit">Assign</button>
                    </div>
                </form>
            </div>
            <div class="col-12" th:if="${actions.canEdit()}">
                <a th:href="@{/deliveries/{id}/edit(id=${d.id()})}" class="btn btn-outline-secondary"
                   data-testid="edit-delivery">Edit details</a>
            </div>
        </div>
    </section>

    <div class="row g-4">
        <section class="col-lg-7" aria-labelledby="details-heading">
            <div class="app-card">
                <h2 id="details-heading" class="h5">Details</h2>
                <dl class="row mb-0 app-dl">
                    <dt class="col-sm-4">Recipient</dt>
                    <dd class="col-sm-8" data-testid="detail-recipient" th:text="${d.recipientName()}">Name</dd>
                    <dt class="col-sm-4">Phone</dt>
                    <dd class="col-sm-8" th:text="${d.recipientPhone()}">Phone</dd>
                    <dt class="col-sm-4">Address</dt>
                    <dd class="col-sm-8" th:text="${d.deliveryAddress()}">Address</dd>
                    <dt class="col-sm-4">City</dt>
                    <dd class="col-sm-8" th:text="${d.deliveryCity()}">City</dd>
                    <dt class="col-sm-4">Reference</dt>
                    <dd class="col-sm-8" data-testid="detail-reference" th:text="${d.referenceNumber() ?: '—'}">—</dd>
                    <dt class="col-sm-4">Assigned agent</dt>
                    <dd class="col-sm-8" data-testid="detail-agent" th:text="${d.assignedAgentName() ?: 'Not assigned'}">—</dd>
                    <dt class="col-sm-4" th:if="${d.failureReason()}">Failure reason</dt>
                    <dd class="col-sm-8" th:if="${d.failureReason()}" th:text="${d.failureReason()}">Reason</dd>
                    <dt class="col-sm-4">Created</dt>
                    <dd class="col-sm-8">
                        <time th:datetime="${d.createdAt()}" th:text="${#temporals.format(d.createdAt(), 'dd MMM yyyy HH:mm') + ' UTC'}">time</time>
                        by <span th:text="${d.createdByName()}">user</span>
                    </dd>
                    <dt class="col-sm-4" th:if="${d.deliveredAt()}">Delivered</dt>
                    <dd class="col-sm-8" th:if="${d.deliveredAt()}"
                        th:text="${#temporals.format(d.deliveredAt(), 'dd MMM yyyy HH:mm') + ' UTC'}">time</dd>
                </dl>
            </div>
        </section>

        <section class="col-lg-5" aria-labelledby="history-heading">
            <div class="app-card">
                <h2 id="history-heading" class="h5">Status history</h2>
                <ol class="app-timeline" data-testid="status-history">
                    <li th:each="h : ${d.history()}" data-testid="history-entry">
                        <div>
                            <span th:if="${h.previousStatus()}" th:text="${h.previousStatus().label()} + ' → '">Prev →</span>
                            <strong th:text="${h.newStatus().label()}">New</strong>
                        </div>
                        <div class="small text-secondary">
                            <span th:text="${h.changedByName()}">Actor</span> ·
                            <time th:datetime="${h.changedAt()}"
                                  th:text="${#temporals.format(h.changedAt(), 'dd MMM yyyy HH:mm') + ' UTC'}">time</time>
                        </div>
                        <div class="small" th:if="${h.reason()}" th:text="${h.reason()}">Reason</div>
                    </li>
                </ol>
            </div>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
