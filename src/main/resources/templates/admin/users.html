<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container app-main">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="page-title mb-1">Users</h1>
            <p class="text-secondary small mb-0">Read-only list of provisioned user accounts.</p>
        </div>
        <span class="text-secondary small">
            <span th:text="${users.size()}">0</span> accounts
        </span>
    </div>

    <div class="app-card p-0 table-responsive">
        <table class="table align-middle mb-0" data-testid="user-table">
            <caption class="visually-hidden">User accounts</caption>
            <thead>
            <tr>
                <th scope="col" class="ps-3">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Role</th>
                <th scope="col" class="pe-3">Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}" data-testid="user-row">
                <td class="ps-3 fw-medium text-dark" th:text="${u.fullName()}">Name</td>
                <td class="text-secondary" th:text="${u.email()}">email</td>
                <td>
                    <span class="text-secondary small" th:text="${u.role()}">ROLE</span>
                </td>
                <td class="pe-3">
                    <span th:class="'user-status ' + (${u.active()} ? 'user-status-active' : 'user-status-inactive')"
                          th:text="${u.active()} ? 'Active' : 'Inactive'">Active</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
