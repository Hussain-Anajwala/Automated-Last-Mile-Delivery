<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main id="main" class="container app-main">
    <h1 class="page-title">Users</h1>
    <p class="text-secondary">Read-only list of accounts. Accounts are provisioned outside the application.</p>
    <div class="app-card p-0 table-responsive">
        <table class="table align-middle mb-0" data-testid="user-table">
            <caption class="visually-hidden">User accounts</caption>
            <thead>
            <tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Role</th><th scope="col">Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}" data-testid="user-row">
                <td th:text="${u.fullName()}">Name</td>
                <td th:text="${u.email()}">email</td>
                <td th:text="${u.role()}">ROLE</td>
                <td th:text="${u.active()} ? 'Active' : 'Inactive'">Active</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
