spring.application.name=lastmile-delivery

# Database connection is supplied by the environment. There is deliberately no password default.
spring.datasource.url=${LASTMILE_DB_URL:jdbc:postgresql://localhost:15432/lastmile}
spring.datasource.username=${LASTMILE_DB_USER:lastmile}
spring.datasource.password=${LASTMILE_DB_PASSWORD:}
# Fail fast instead of hanging when the database is unreachable (readiness depends on this).
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema; Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${LASTMILE_SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework
