# Jenkins Configuration as Code. Secrets are injected from environment variables (ci/jenkins/.env,
# git-ignored) and never stored here.
jenkins:
  systemMessage: "LastMile Ops CI (local only, bound to 127.0.0.1)"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8090/"

# Multibranch pipeline over the public GitHub repository. Branches with a Jenkinsfile get a job.
# There is no inbound webhook (Jenkins is not exposed): the folder re-scans every 2 minutes and
# builds branches whose head commit changed — SCM polling in multibranch form.
jobs:
  - script: |
      multibranchPipelineJob('lastmile-delivery') {
        displayName('LastMile Delivery')
        description('Builds every branch that contains a Jenkinsfile. Triggered by periodic SCM scan (2 min).')
        branchSources {
          branchSource {
            source {
              git {
                id('lastmile-github')
                remote('https://github.com/Hussain-Anajwala/Automated-Last-Mile-Delivery.git')
                traits {
                  gitBranchDiscovery()
                }
              }
            }
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('2m')
          }
        }
      }
