# Uses only ansible.builtin modules (the control node has ansible-core without extra collections).
# Every command task states when it changes something, so a second run reports changed=0.

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the timezone (only when it differs)
  ansible.builtin.command: timedatectl set-timezone {{ base_timezone }}
  when: (ansible_facts['date_time']['tz'] | default('')) not in ['UTC', 'Etc/UTC']
  changed_when: true

- name: Read current firewall status
  ansible.builtin.command: ufw status verbose
  register: base_ufw_status
  changed_when: false
  when: base_manage_firewall

- name: Allow SSH through the firewall before enabling it (never lock out the control node)
  ansible.builtin.command: ufw allow {{ base_ssh_port }}/tcp
  when:
    - base_manage_firewall
    - ((base_ssh_port | string) + '/tcp') not in base_ufw_status.stdout
  changed_when: true

- name: Default-deny incoming traffic and enable the firewall
  ansible.builtin.shell: ufw default deny incoming && ufw default allow outgoing && ufw --force enable
  when:
    - base_manage_firewall
    - "'Status: active' not in base_ufw_status.stdout"
  changed_when: true
