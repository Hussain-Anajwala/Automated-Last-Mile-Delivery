# Restore a recorded release on the target.
#   rollback.yml                                   -> /opt/lastmile/releases/previous (undo the last release)
#   rollback.yml -e lastmile_rollback_record=current -> /opt/lastmile/releases/current (recover from a failed
#                                                      deployment: "current" is only written after a healthy deploy)
# Redeploys the immutable tag with the same role (pull exact tag, up --wait, readiness and revision checks).
# Database contents are not rolled back (forward-only migrations; docs/ANSIBLE.md).
- name: Roll back LastMile to the previous known-good release
  hosts: lastmile_targets
  become: true
  gather_facts: true

  pre_tasks:
    - name: Choose which recorded release to restore
      ansible.builtin.assert:
        that:
          - (lastmile_rollback_record | default('previous')) in ['previous', 'current']
        quiet: true

    - name: Read the recorded release tag on the target
      ansible.builtin.slurp:
        src: "/opt/lastmile/releases/{{ lastmile_rollback_record | default('previous') }}"
      register: rollback_previous

    - name: Use it as the release to deploy
      ansible.builtin.set_fact:
        lastmile_image_tag: "{{ rollback_previous.content | b64decode | trim }}"

    - name: Refuse anything that is not a recorded commit tag
      ansible.builtin.assert:
        that:
          - lastmile_image_tag is regex('^[0-9a-f]{12}$')
        fail_msg: "No valid previous release recorded on {{ inventory_hostname }}"
        quiet: true

    - name: Announce the rollback target
      ansible.builtin.debug:
        msg: "Rolling back to {{ lastmile_image_tag }}"

  roles:
    - role: lastmile_app
